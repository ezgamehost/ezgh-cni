name: CI

# Lint and tests on every pull request and push to main; nothing here has a secret or pushes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "not gofmt-ed:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      # The kernel tests run in the netns job; vet them here too.
      - run: go vet -tags netns ./internal/cni/...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: scripts/check-logging.sh

  arm64:
    # Releases ship arm64 binaries too: they must keep building.
    name: linux/arm64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/...

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race
        # service-template's pipeline owns the vendored kit's tests.
        run: |
          mapfile -t packages < <(go list ./... | grep -v /internal/kit/)
          go test -race "${packages[@]}"

  netns:
    # The kernel tests (build tag netns): veths, routes, rules, the dummy pod identity link and
    # nftables, each test in its own network namespaces (scripts/netns-test.sh on a Mac).
    name: Kernel tests (netns)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: nftables, iproute2 and the dummy module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nftables iproute2
          sudo modprobe dummy || { sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)" && sudo modprobe dummy; }
      - name: go test -tags netns (as root)
        # Under EZGH_CNI_KERNEL_TESTS=required a test that would skip fails, and so does the step.
        shell: bash
        run: |
          # Upstream portmap at go.mod's plugins version, for the hostPort test (the image ships it).
          go install "github.com/containernetworking/plugins/plugins/meta/portmap@$(go list -m -f '{{.Version}}' github.com/containernetworking/plugins)"
          go test -tags netns -count=1 -v -exec "sudo env EZGH_CNI_KERNEL_TESTS=required EZGH_CNI_PORTMAP=$(go env GOPATH)/bin/portmap" ./internal/cni/... | tee "$RUNNER_TEMP/netns.log"
          if grep -qE '^\s*--- SKIP' "$RUNNER_TEMP/netns.log"; then echo "::error::kernel tests skipped"; exit 1; fi

  image:
    name: Image (built, not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: kubernetes/vpc-cni:ci
